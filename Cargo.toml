[package]
name = "triangulumancer"
version = "0.4.0-dev"
description = "Compute and work with triangulations of point and vector configurations."
authors = ["Andres Rios Tascon"]
edition = "2024"
# Edition 2024 requires 1.85; nothing here needs anything newer yet.
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/ariostas/triangulumancer"
readme = "README.md"
keywords = ["triangulation", "delaunay", "polytope", "geometry", "combinatorics"]
categories = ["science", "mathematics", "algorithms"]
exclude = ["/.github", "/scripts", "/python", "/tests/fixtures"]

[lib]
name = "triangulumancer"
crate-type = ["lib", "cdylib"]

[features]
default = []
# The Python bindings, i.e. the `python` module. Only the extension module built by
# maturin needs them (see `[tool.maturin]` in pyproject.toml), so plain Rust builds
# do not have to compile pyo3.
python = ["dep:pyo3", "dep:numpy"]
# Reserved, not implemented. Regularity checking is the one piece of future TOPCOM
# functionality that would need a solver (PLAN.md section 6.3); naming the slot now
# means adding it later never forces an LP dependency on library users who do not
# want it.
# lp = ["dep:good_lp"]

[dependencies]
# Phase 1 adds `dashu-int` (bigint fallback tier for exact determinant signs) and
# Phase 6 adds `robust` (d = 2, 3 predicate fast paths). Neither is declared yet
# because nothing uses them; see PLAN.md section 4.

[dependencies.pyo3]
version = "0.29"
features = ["abi3-py310"]
optional = true

[dependencies.numpy]
version = "0.29"
optional = true

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "./docs-header.html"]
