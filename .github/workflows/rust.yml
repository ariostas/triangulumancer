name: Rust CI

on:
  push:
    branches:
      - main
      # The Rust migration is a long-lived branch developed over several
      # phases; its commits need checking too, not just the eventual merge.
      - rust-migration
  pull_request:
    branches:
      - main
      - rust-migration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # This workflow builds the dev profile while the Python workflow builds
          # release; sharing a key would leave one of them restoring a target dir
          # without its profile.
          key: dev
      # `--locked` fails the build rather than silently re-resolving when
      # Cargo.lock is out of date with Cargo.toml. Without it a manifest change
      # committed without its lockfile update would be tested against a
      # dependency set that is in nobody's tree.
      - name: Build
        run: cargo build --locked --verbose
      - name: Build with the Python bindings
        run: cargo build --locked --features python --verbose
      - name: Run tests
        run: cargo test --locked --verbose
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Clippy with the Python bindings
        run: cargo clippy --locked --features python --all-targets -- -D warnings
      # What docs.rs will build, with the same KaTeX header.
      - name: Documentation
        if: matrix.os == 'ubuntu-24.04'
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings --html-in-header docs-header.html
      # Builds the crate from exactly the files crates.io would get, so a file
      # missing from `include` in Cargo.toml fails here rather than at release.
      - name: Package
        if: matrix.os == 'ubuntu-24.04'
        run: cargo package --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Install the toolchain named by rust-version in Cargo.toml
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 --locked | jq -r '.packages[0].rust_version')
          rustup toolchain install "$msrv" --profile minimal
          echo "MSRV=$msrv" >> "$GITHUB_ENV"
      # The library only, with every feature (the Python bindings included).
      # Not the tests or benchmarks: their dev-dependencies (criterion) may
      # need a newer compiler, which does not bind the crate's users.
      - name: Check
        run: cargo +"$MSRV" check --locked --all-features

  check-rust:
    name: Check Rust
    if: always()
    needs: [build-and-test, msrv]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
