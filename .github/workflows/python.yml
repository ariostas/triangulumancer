name: Python CI

on:
  push:
    branches:
      - main
      # The Rust migration is a long-lived branch developed over several
      # phases; its commits need checking too, not just the eventual merge.
      - rust-migration
  pull_request:
    branches:
      - main
      - rust-migration

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2022]
        python-version: ["3.10", "3.14", "3.14t"]
    env:
      # `pip install .` drives cargo through maturin, which takes its cargo
      # flags from this variable; the Rust workflow passes `--locked` directly.
      MATURIN_PEP517_ARGS: --locked
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Pip install the package
        run: python -m pip install .[test]
      - name: Run pytest
        run: pytest -vv
      # The README's examples are doctests; the code fences have to go first,
      # or doctest reads each closing fence as part of the expected output.
      - name: Check the README examples
        shell: bash
        run: |
          sed 's/^```.*$//' README.md > "$RUNNER_TEMP/README.txt"
          python -m doctest -o ELLIPSIS "$RUNNER_TEMP/README.txt"

  wheel-selection:
    name: Check the wheel selection
    runs-on: ubuntu-latest
    # `deploy.yml` only runs on a release, so a cibuildwheel configuration it can
    # no longer parse would otherwise surface only then. This asks the same
    # pinned cibuildwheel, with the same configuration, which wheels it would
    # build on each platform, and checks the answer is exactly cp310 (the abi3
    # wheel), cp314 (its test on the newest interpreter) and cp314t for each
    # platform tag.
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Print and check the build identifiers
        shell: bash
        run: |
          version=$(grep -oP 'pypa/cibuildwheel@v\K[0-9.]+' .github/workflows/deploy.yml)
          for platform in linux macos windows; do
            pipx run "cibuildwheel==$version" --print-build-identifiers --platform "$platform" \
              | tee "$RUNNER_TEMP/ids"
            python3 - "$RUNNER_TEMP/ids" <<'EOF'
          import collections, sys
          by_tag = collections.defaultdict(set)
          for line in open(sys.argv[1]).read().split():
              python, _, tag = line.partition("-")
              by_tag[tag].add(python)
          expected = {"cp310", "cp314", "cp314t"}
          bad = {tag: sorted(got) for tag, got in by_tag.items() if got != expected}
          if not by_tag or bad:
              sys.exit(f"unexpected wheel selection: {dict(by_tag) or 'nothing'}")
          EOF
          done

  check-python:
    name: Check Python
    if: always()
    needs: [build-and-test, wheel-selection]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
