name: Deploy

on:
  workflow_dispatch:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  make-sdist:
    name: Make SDist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build SDist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  build-wheels:
    name: Build wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is arm64 and macos-15-intel x86_64; each builds its native
        # architecture, so every wheel is tested where it was built.
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2022]
    env:
      # These are the artifacts users actually install, so the wheels must be
      # built from the committed lockfile rather than a fresh resolution.
      MATURIN_PEP517_ARGS: --locked
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      - name: Build wheels
        run: pipx run cibuildwheel
        env:
          CIBW_ENVIRONMENT: 'CARGO_TERM_COLOR="always" MATURIN_PEP517_ARGS="--locked"'
          # Only the Linux builds run in a container, where rustup installs into
          # $HOME/.cargo. On macOS and Windows the runner's own Rust is on PATH
          # already, and a ':'-separated PATH would corrupt Windows' PATH.
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH" CARGO_TERM_COLOR="always" MATURIN_PEP517_ARGS="--locked"'
          CIBW_BEFORE_BUILD: rustup show
          CIBW_BEFORE_BUILD_LINUX: >
            curl https://sh.rustup.rs -sSf | sh -s -- --default-toolchain=stable --profile=minimal -y &&
            rustup show
          CIBW_TEST_COMMAND: "pytest -vv {project}/python/tests"
          CIBW_TEST_EXTRAS: test
          # abi3-py310 covers every GIL-enabled CPython with a single wheel, but
          # free-threaded 3.14 has no stable ABI (abi3t arrives with 3.15, per
          # PEP 803), so it needs its own version-specific wheel. cp314 builds
          # nothing new: cibuildwheel reuses the cp310 abi3 wheel and only tests
          # it, on the newest interpreter.
          CIBW_BUILD: "cp310-* cp314-* cp314t-*"
          CIBW_ENABLE: cpython-freethreading
          # 32-bit targets: the runners' Rust toolchains do not include them, and
          # 0.3 did not ship them either.
          CIBW_SKIP: "*_i686 *-win32"
          CIBW_BUILD_VERBOSITY: 1
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ github.event.release.tag_name }}-${{ matrix.os }}
          retention-days: 1
          path: wheelhouse/*.whl

  deploy-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, make-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/triangulumancer
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  deploy-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    # Just to make sure both get deployed together.
    needs: [build-wheels, make-sdist]
    environment:
      name: crates.io
      url: https://crates.io/crates/triangulumancer
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Check out repo
        uses: actions/checkout@v7
      # A new crate's first release needs an API token. Once the crate exists,
      # crates.io trusted publishing can replace it: configure the repository
      # there, grant `id-token: write`, and swap this for
      # rust-lang/crates-io-auth-action.
      - name: Publish to crates.io
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
